<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Toronto Region Selector</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; display: flex; height: 100vh; }
  #side { width: 320px; display: flex; flex-direction: column; border-right: 1px solid #ccc; background: #fafafa; }
  #side header { padding: 12px; border-bottom: 1px solid #ddd; }
  h1 { font-size: 16px; margin: 0 0 8px; }
  input[type=search] { width: 100%; padding: 8px; border: 1px solid #bbb; border-radius: 6px; }
  .btns { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  button { padding: 6px 10px; border: 0; border-radius: 6px; background: #2f4f9f; color: #fff; cursor: pointer; }
  button.alt { background: #ddd; color: #222; }
  #list { flex: 1; overflow-y: auto; padding: 4px 12px; }
  #list label { display: flex; gap: 8px; padding: 4px 0; cursor: pointer; font-size: 14px; }
  #count { font-size: 13px; color: #555; margin-top: 8px; }
  #map { flex: 1; }
  #msg { padding: 12px; font-size: 13px; color: #a33; }
  @media (max-width: 700px) { body { flex-direction: column-reverse; } #side { width: 100%; height: 45%; } }
</style>
</head>
<body>
<div id="side">
  <header>
    <h1>Toronto Regions</h1>
    <input id="q" type="search" placeholder="Search neighbourhoods...">
    <div class="btns">
      <button id="all" class="alt">Select all</button>
      <button id="none" class="alt">Clear</button>
      <button id="copy">Copy selected</button>
      <button id="load" class="alt">Load GeoJSON…</button>
    </div>
    <div id="count">0 selected</div>
    <input id="file" type="file" accept=".geojson,.json" hidden>
  </header>
  <div id="msg" hidden></div>
  <div id="list"></div>
</div>
<div id="map"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// Put the Toronto neighbourhoods GeoJSON (WGS84) next to this file with this name:
const GEOJSON_URL = "neighbourhoods.geojson";
// Property that holds each region's name (the city's dataset uses AREA_NAME):
const NAME_KEYS = ["AREA_NAME", "NEIGHBOURHOOD_NAME", "name", "NAME"];

const STYLE = {
  normal:   { color: "#6b7280", weight: 1, fillColor: "#f1ede6", fillOpacity: 0.35 },
  hover:    { weight: 2, color: "#2f4f9f", fillOpacity: 0.55 },
  selected: { color: "#2f4f9f", weight: 2, fillColor: "#5a6fc4", fillOpacity: 0.6 }
};

const map = L.map("map").setView([43.7, -79.4], 11);
L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
  attribution: "&copy; OpenStreetMap contributors &copy; CARTO", maxZoom: 18
}).addTo(map);

const regions = new Map();   // name -> { layer, selected, checkbox }
let geoLayer;

const nameOf = p => {
  for (const k of NAME_KEYS) if (p && p[k]) return String(p[k]).replace(/\s*\(\d+\)\s*$/, "");
  return "Unnamed";
};

function paint(r) { r.layer.setStyle(r.selected ? STYLE.selected : STYLE.normal); }

function setSelected(name, value) {
  const r = regions.get(name);
  if (!r) return;
  r.selected = value;
  r.checkbox.checked = value;
  paint(r);
  updateCount();
}

function updateCount() {
  const n = [...regions.values()].filter(r => r.selected).length;
  document.getElementById("count").textContent = `${n} of ${regions.size} selected`;
}

function build(geojson) {
  if (geoLayer) map.removeLayer(geoLayer);
  regions.clear();
  const list = document.getElementById("list");
  list.innerHTML = "";

  geoLayer = L.geoJSON(geojson, {
    style: STYLE.normal,
    onEachFeature: (f, layer) => {
      const name = nameOf(f.properties);
      layer.bindTooltip(name, { sticky: true });
      layer.on({
        click: () => setSelected(name, !regions.get(name).selected),
        mouseover: () => { if (!regions.get(name).selected) layer.setStyle(STYLE.hover); },
        mouseout: () => paint(regions.get(name))
      });
      regions.set(name, { layer, selected: false, checkbox: null });
    }
  }).addTo(map);

  [...regions.keys()].sort().forEach(name => {
    const label = document.createElement("label");
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.onchange = () => setSelected(name, cb.checked);
    label.append(cb, name);
    label.dataset.name = name.toLowerCase();
    list.append(label);
    regions.get(name).checkbox = cb;
  });

  map.fitBounds(geoLayer.getBounds());
  updateCount();
}

function showError(text) {
  const m = document.getElementById("msg");
  m.hidden = !text; m.textContent = text || "";
}

fetch(GEOJSON_URL)
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(build)
  .catch(() => showError(
    `Couldn't load ${GEOJSON_URL}. Serve this folder with "python -m http.server" ` +
    `or use "Load GeoJSON…" to pick the file manually.`));

// UI
document.getElementById("q").oninput = e => {
  const t = e.target.value.toLowerCase();
  document.querySelectorAll("#list label").forEach(l => l.hidden = !l.dataset.name.includes(t));
};
document.getElementById("all").onclick = () => regions.forEach((_, n) => setSelected(n, true));
document.getElementById("none").onclick = () => regions.forEach((_, n) => setSelected(n, false));
document.getElementById("copy").onclick = () => {
  const sel = [...regions].filter(([, r]) => r.selected).map(([n]) => n);
  navigator.clipboard.writeText(JSON.stringify(sel, null, 2));
  alert(`Copied ${sel.length} region(s) to clipboard`);
};
document.getElementById("load").onclick = () => document.getElementById("file").click();
document.getElementById("file").onchange = async e => {
  try { build(JSON.parse(await e.target.files[0].text())); showError(""); }
  catch { showError("That file isn't valid GeoJSON."); }
};
</script>
</body>
</html>
